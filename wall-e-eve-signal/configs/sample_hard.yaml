# sample_hard.yaml
# Hard 15x15 mission — WALL-E searching for EVE
# Dense obstacles, weak initial signal, decoys, high sensor noise

map:
  width: 15
  height: 15
  seed: 99
  obstacles:
    - [1,  3]
    - [2,  3]
    - [3,  7]
    - [4,  7]
    - [4,  8]
    - [6,  1]
    - [6,  2]
    - [8,  5]
    - [8,  6]
    - [9,  9]
    - [10, 4]
    - [11, 8]
    - [12, 6]
    - [13, 2]

eve: [12, 11]

initial_signal:
  direction: 'E'
  strength: 0.4
  timestamp: 0

resources:
  battery: 220
  time_limit: 100
  move_cost: 3
  scan_cost: 8
  recharge_cost: 2
  recharge_amount: 40
  recharge_stations:
    - [2,  2]
    - [13, 13]
    - [7,  7]

# Integer seed: environment will procedurally generate 6 clues using seed 99
clues: 99

sensor_noise: 0.15

decoys:
  - position: [5,  5]
    strength: 0.6
  - position: [10, 3]
    strength: 0.5
